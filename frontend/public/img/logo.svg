<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-label="SHOP'IMT">
  <!-- Marque SHOP'IMT : création originale aux couleurs de la charte IMT (bleu 2199C #00B8DE, marine 533C #14223C).
       Le logo officiel IMT n'est pas utilisé : la charte interdit de le modifier ou de l'associer à une autre marque. -->
  <g transform="translate(4 4)">
    <rect width="56" height="56" rx="14" fill="#14223C"/>
    <path d="M20 22v-4a8 8 0 0 1 16 0v4" fill="none" stroke="#00B8DE" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M13 22h30l-2.4 22.5a3 3 0 0 1-3 2.5H18.4a3 3 0 0 1-3-2.5z" fill="#00B8DE"/>
    <text x="28" y="40.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="11.5" fill="#fff" letter-spacing=".5">IMT</text>
  </g>
  <style>@media (prefers-color-scheme: dark) { .mot { fill: #fff } }</style>
  <text class="mot" x="72" y="42" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="-.5" fill="#14223C">SHOP<tspan fill="#00B8DE">'</tspan>IMT</text>
</svg>
